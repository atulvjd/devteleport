services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: developer
      POSTGRES_DB: teleport_dev
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
