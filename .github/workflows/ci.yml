name: Verify DevTeleport
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    strategy:
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
        env:
          FORCE_COLOR: "1"
      - run: npm run test:transfer
      - run: npm run test:updates
      - run: npm run package:cli
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}
          path: dist/*.tgz
  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y postgresql
      - run: echo "/usr/lib/postgresql/$(ls /usr/lib/postgresql | sort -V | tail -1)/bin" >> "$GITHUB_PATH"
      - run: npm run test:postgres
      - run: npm run test:docker:live
      - run: npm run test:docker
      - run: npm run test:e2e
        env:
          FORCE_COLOR: "1"
      - run: npm run test:full
        env:
          FORCE_COLOR: "1"
  applications:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: test "$(uname -m)" = arm64
      - run: npm run test:desktop
      - run: npm run test:desktop:transfer
      - run: |
          if [ "$(uname -m)" = "arm64" ]; then dtp_code_platform=darwin-arm64; else dtp_code_platform=darwin; fi
          curl -fsSL "https://update.code.visualstudio.com/latest/$dtp_code_platform/stable" -o "$RUNNER_TEMP/vscode.zip"
          unzip -q "$RUNNER_TEMP/vscode.zip" -d "$RUNNER_TEMP/vscode"
          for dtp_binary in "$RUNNER_TEMP/vscode/Visual Studio Code.app/Contents/MacOS/"*; do
            if [ -f "$dtp_binary" ] && [ -x "$dtp_binary" ]; then echo "DEVTELEPORT_VSCODE_BINARY=$dtp_binary" >> "$GITHUB_ENV"; break; fi
          done
      - run: npm run package:extension
      - run: npm run test:vscode
        env:
          DTP_TEST_VSIX: apps/vscode-extension/devteleport-0.2.0.vsix
      - run: npm run test:vscode
        env:
          DTP_TEST_VSIX: apps/vscode-extension/devteleport-0.2.0.vsix
          DTP_TEST_UNTRUSTED: "1"
      - run: npm run package:desktop -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: npm run verify:distribution
      - run: npm run verify:architecture
      - run: node scripts/desktop-smoke.mjs
        env:
          DEVTELEPORT_APP_BINARY: dist/desktop/mac-arm64/DevTeleport.app/Contents/MacOS/DevTeleport
          DEVTELEPORT_EXPECT_ARCH: arm64
      - run: node scripts/desktop-visual.mjs
        env:
          DEVTELEPORT_APP_BINARY: dist/desktop/mac-arm64/DevTeleport.app/Contents/MacOS/DevTeleport
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-applications
          path: |
            apps/vscode-extension/*.vsix
            dist/desktop/*.dmg
            dist/desktop/*.zip
            dist/evidence/*
            dist/ui-review/*.png
